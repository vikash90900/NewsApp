services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsapp-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://host.docker.internal:27017/newsapp
    networks:
      - newsapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newsapp-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    networks:
      - newsapp-network

networks:
  newsapp-network:
    driver: bridge